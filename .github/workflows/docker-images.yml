name: Docker Image Build Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  docker-images:
    name: Build ${{ matrix.platform.label }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: linux-amd64
            docker_platform: linux/amd64
          - label: linux-arm64
            docker_platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare image build package
        run: npm run dist:image-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Verify image build from dist package
        shell: bash
        run: |
          set -euo pipefail
          base_image="tb-config-mate-base:${{ matrix.platform.label }}"
          image_name="tb-config-mate:${{ matrix.platform.label }}"

          pushd dist/config-mate-image-build
          PLATFORM="${{ matrix.platform.docker_platform }}" BASE_IMAGE_NAME="${base_image}" ./build-base.sh
          PLATFORM="${{ matrix.platform.docker_platform }}" BASE_IMAGE_NAME="${base_image}" IMAGE_NAME="${image_name}" ./build-image.sh
          popd

          docker image rm "${image_name}" "${base_image}" || true
