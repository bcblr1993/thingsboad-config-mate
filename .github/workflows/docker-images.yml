name: Docker Image Build Check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

jobs:
  docker-images:
    name: Build ${{ matrix.platform.label }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: linux-amd64
            docker_platform: linux/amd64
            artifact: tb-config-mate_linux_amd64.tar.gz
          - label: linux-arm64
            docker_platform: linux/arm64
            artifact: tb-config-mate_linux_arm64.tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare image build package
        run: npm run dist:image-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build image tar from dist package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker
          base_image="tb-config-mate-base:${{ matrix.platform.label }}"

          pushd dist/config-mate-image-build
          PLATFORM="${{ matrix.platform.docker_platform }}" BASE_IMAGE_NAME="${base_image}" ./build-base.sh
          PLATFORM="${{ matrix.platform.docker_platform }}" BASE_IMAGE_NAME="${base_image}" IMAGE_NAME="tb-config-mate:latest" ./build-image.sh
          popd

          docker save tb-config-mate:latest | gzip -9 > "dist/docker/${{ matrix.platform.artifact }}"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist/docker/${{ matrix.platform.artifact }}
          if-no-files-found: error
