name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.4.14. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            release_tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            version="$(node -p "require('./package.json').version")"
            release_tag="v${version}"
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "Using release tag: ${release_tag}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Build standalone binaries
        run: npm run build

      - name: Prepare image build package
        run: npm run dist:image-build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build Docker image tarballs from dist package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/docker

          build_image_tar() {
            local platform="$1"
            local label="$2"
            local output="$3"
            local base_image="tb-config-mate-base:${label}"

            pushd dist/config-mate-image-build
            PLATFORM="${platform}" BASE_IMAGE_NAME="${base_image}" ./build-base.sh
            PLATFORM="${platform}" BASE_IMAGE_NAME="${base_image}" IMAGE_NAME="tb-config-mate:latest" ./build-image.sh
            popd

            docker save tb-config-mate:latest | gzip -9 > "dist/docker/${output}"
            echo "Created dist/docker/${output}"
          }

          build_image_tar "linux/amd64" "linux-amd64" "tb-config-mate_linux_amd64.tar.gz"
          build_image_tar "linux/arm64" "linux-arm64" "tb-config-mate_linux_arm64.tar.gz"

      - name: List release assets
        run: |
          find dist -maxdepth 2 -type f -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Config Mate ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/tb-config-mate-*
            dist/config-mate-image-build.tar.gz
            dist/docker/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
