name: Release
run-name: Release ${{ github.ref_name || inputs.tag || github.sha }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.4.14. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: write

env:
  CI_IMAGE_BUILD_ARGS: >-
    --build-arg NODE_IMAGE=node:18-bookworm-slim
    --build-arg APT_MIRROR=deb.debian.org
    --build-arg APT_SECURITY_MIRROR=security.debian.org/debian-security
    --build-arg NPM_REGISTRY=https://registry.npmjs.org
    --build-arg DOCKER_DOWNLOAD_BASE=https://download.docker.com/linux/static/stable
    --build-arg COMPOSE_DOWNLOAD_BASE=https://github.com/docker/compose/releases/download

jobs:
  release:
    name: Build Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve release tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            release_tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            version="$(node -p "require('./package.json').version")"
            release_tag="v${version}"
          fi
          echo "RELEASE_TAG=${release_tag}" >> "${GITHUB_ENV}"
          echo "RELEASE_ASSET=dist/config-mate-image-build-${release_tag}.tar.gz" >> "${GITHUB_ENV}"
          echo "Using release tag: ${release_tag}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Prepare image build package
        run: npm run dist:image-build

      - name: Verify release package name
        shell: bash
        run: |
          set -euo pipefail
          test -f "${RELEASE_ASSET}"
          echo "Release package: ${RELEASE_ASSET}"

      - name: Verify Docker image build from dist package
        shell: bash
        run: |
          set -euo pipefail
          pushd dist/config-mate-image-build
          PLATFORM="linux/amd64" BASE_IMAGE_NAME="tb-config-mate-base:release-check" EXTRA_BUILD_ARGS="${CI_IMAGE_BUILD_ARGS}" ./build-base.sh
          PLATFORM="linux/amd64" BASE_IMAGE_NAME="tb-config-mate-base:release-check" IMAGE_NAME="tb-config-mate:release-check" ./build-image.sh
          popd
          docker image rm tb-config-mate:release-check tb-config-mate-base:release-check || true

      - name: List release assets
        run: |
          find dist -maxdepth 2 -type f -print | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Config Mate ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: ${{ env.RELEASE_ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
